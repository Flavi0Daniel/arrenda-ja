<div class="text-center py-5">
  <div class="spinner-border" 
       [ngClass]="{
         'spinner-border-sm': tamanho === 'small',
         'spinner-border-lg': tamanho === 'large'
       }"
       role="status">
    <span class="visually-hidden">A carregar...</span>
  </div>
  <p class="mt-3 text-muted">{{ mensagem }}</p>
</div>
