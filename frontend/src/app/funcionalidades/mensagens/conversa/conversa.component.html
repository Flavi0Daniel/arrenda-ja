<div class="chat-container">
  <!-- Cabeçalho da Conversa -->
  <div class="chat-header bg-primary text-white p-3 shadow-sm">
    <div class="container">
      <div class="d-flex align-items-center">
        <button 
          class="btn btn-link text-white p-0 me-3"
          (click)="voltarParaLista()">
          <i class="bi bi-arrow-left fs-4"></i>
        </button>
        
        <div class="flex-grow-1">
          <h5 class="mb-0">{{ nomeOutroUtilizador }}</h5>
          <small class="opacity-75" *ngIf="mensagens.length > 0 && mensagens[0].imovelTitulo">
            <i class="bi bi-house me-1"></i>
            {{ mensagens[0].imovelTitulo }}
          </small>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="carregando" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">A carregar...</span>
    </div>
    <p class="mt-2 text-muted">A carregar conversa...</p>
  </div>

  <!-- Erro -->
  <div class="container mt-3" *ngIf="erro">
    <div class="alert alert-danger">
      <i class="bi bi-exclamation-triangle me-2"></i>
      {{ erro }}
    </div>
  </div>

  <!-- Área de Mensagens -->
  <div 
    #chatContainer
    class="chat-messages p-3"
    *ngIf="!carregando && !erro">
    
    <div class="container">
      <!-- Nenhuma mensagem -->
      <div class="text-center py-5" *ngIf="mensagens.length === 0">
        <i class="bi bi-chat-dots fs-1 text-muted"></i>
        <h5 class="mt-3 text-muted">Nenhuma mensagem ainda</h5>
        <p class="text-muted">Envie a primeira mensagem para iniciar a conversa!</p>
      </div>

      <!-- Lista de Mensagens -->
      <div *ngFor="let mensagem of mensagens" class="mb-3">
        <div 
          class="d-flex"
          [class.justify-content-end]="eMinhaMensagem(mensagem)">
          
          <div 
            class="message-bubble p-3 rounded"
            [class.message-sent]="eMinhaMensagem(mensagem)"
            [class.message-received]="!eMinhaMensagem(mensagem)"
            style="max-width: 70%;">
            
            <p class="mb-1">{{ mensagem.conteudo }}</p>
            
            <div class="d-flex justify-content-between align-items-center mt-2">
              <small class="text-muted opacity-75">
                {{ formatarHora(mensagem.dataEnvio) }}
              </small>
              
              <i 
                *ngIf="eMinhaMensagem(mensagem)"
                class="bi ms-2"
                [class.bi-check2-all]="mensagem.foiLida"
                [class.bi-check2]="!mensagem.foiLida"
                [class.text-primary]="mensagem.foiLida"
                [class.text-muted]="!mensagem.foiLida">
              </i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Input de Nova Mensagem -->
  <div class="chat-input bg-white border-top p-3 shadow-sm" *ngIf="!carregando">
    <div class="container">
      <form (ngSubmit)="enviarMensagem()" class="d-flex gap-2">
        <input 
          type="text" 
          class="form-control" 
          placeholder="Escreva uma mensagem..."
          [(ngModel)]="novaMensagem"
          name="novaMensagem"
          [disabled]="enviando"
          (keydown.enter)="enviarMensagem(); $event.preventDefault()">
        
        <button 
          type="submit" 
          class="btn btn-primary"
          [disabled]="!novaMensagem.trim() || enviando">
          <i class="bi bi-send-fill" *ngIf="!enviando"></i>
          <span class="spinner-border spinner-border-sm" *ngIf="enviando"></span>
        </button>
      </form>
    </div>
  </div>
</div>
