<div class="modal-backdrop show" (click)="fecharModal()"></div>

<div class="modal show d-block" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="bi me-2" [class.bi-person-plus]="!modoEdicao" [class.bi-pencil-square]="modoEdicao"></i>
          {{ modoEdicao ? 'Editar Utilizador' : 'Novo Utilizador' }}
        </h5>
        <button 
          type="button" 
          class="btn-close" 
          (click)="fecharModal()"
          [disabled]="processando">
        </button>
      </div>

      <div class="modal-body">
        <!-- Mensagem de Erro -->
        <div class="alert alert-danger" *ngIf="erro">
          <i class="bi bi-exclamation-triangle me-2"></i>
          {{ erro }}
        </div>

        <!-- Formulário -->
        <form (ngSubmit)="salvar()">
          <!-- Nome Completo -->
          <div class="mb-3">
            <label class="form-label">Nome Completo *</label>
            <input 
              type="text" 
              class="form-control" 
              [(ngModel)]="dados.nomeCompleto"
              name="nomeCompleto"
              required
              [disabled]="processando"
              placeholder="Ex: João Silva">
          </div>

          <!-- Email (apenas criação) -->
          <div class="mb-3" *ngIf="!modoEdicao">
            <label class="form-label">Email *</label>
            <input 
              type="email" 
              class="form-control" 
              [(ngModel)]="dados.email"
              name="email"
              required
              [disabled]="processando"
              placeholder="Ex: joao@exemplo.com">
          </div>

          <!-- Email (edição - apenas visualização) -->
          <div class="mb-3" *ngIf="modoEdicao">
            <label class="form-label">Email</label>
            <input 
              type="email" 
              class="form-control" 
              [value]="dados.email"
              disabled>
            <small class="text-muted">O email não pode ser alterado</small>
          </div>

          <!-- Senha (apenas criação) -->
          <div class="mb-3" *ngIf="!modoEdicao">
            <label class="form-label">Senha *</label>
            <div class="input-group">
              <input 
                [type]="mostrarSenha ? 'text' : 'password'" 
                class="form-control" 
                [(ngModel)]="dados.senha"
                name="senha"
                required
                minlength="6"
                [disabled]="processando"
                placeholder="Mínimo 6 caracteres">
              <button 
                class="btn btn-outline-secondary" 
                type="button"
                (click)="toggleMostrarSenha()"
                [disabled]="processando">
                <i class="bi" [class.bi-eye]="!mostrarSenha" [class.bi-eye-slash]="mostrarSenha"></i>
              </button>
            </div>
          </div>

          <!-- Confirmar Senha (apenas criação) -->
          <div class="mb-3" *ngIf="!modoEdicao">
            <label class="form-label">Confirmar Senha *</label>
            <div class="input-group">
              <input 
                [type]="mostrarConfirmarSenha ? 'text' : 'password'" 
                class="form-control" 
                [(ngModel)]="dados.confirmarSenha"
                name="confirmarSenha"
                required
                [disabled]="processando"
                placeholder="Digite a senha novamente">
              <button 
                class="btn btn-outline-secondary" 
                type="button"
                (click)="toggleMostrarConfirmarSenha()"
                [disabled]="processando">
                <i class="bi" [class.bi-eye]="!mostrarConfirmarSenha" [class.bi-eye-slash]="mostrarConfirmarSenha"></i>
              </button>
            </div>
          </div>

          <!-- Telefone -->
          <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input 
              type="tel" 
              class="form-control" 
              [(ngModel)]="dados.telefone"
              name="telefone"
              [disabled]="processando"
              placeholder="Ex: +244 923 456 789">
          </div>

          <!-- Tipo de Utilizador -->
          <div class="mb-3">
            <label class="form-label">Tipo de Utilizador *</label>
            <select 
              class="form-select"
              [(ngModel)]="dados.tipoUtilizador"
              name="tipoUtilizador"
              required
              [disabled]="processando">
              <option value="arrendatario">Arrendatário</option>
              <option value="proprietario">Proprietário</option>
              <option value="administrador">Administrador</option>
            </select>
            <small class="text-muted">
              Define as permissões do utilizador no sistema
            </small>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button 
          type="button" 
          class="btn btn-secondary" 
          (click)="fecharModal()"
          [disabled]="processando">
          Cancelar
        </button>
        <button 
          type="submit" 
          class="btn btn-primary"
          (click)="salvar()"
          [disabled]="processando">
          <span class="spinner-border spinner-border-sm me-2" *ngIf="processando"></span>
          <i class="bi bi-check-lg me-1" *ngIf="!processando"></i>
          {{ modoEdicao ? 'Salvar Alterações' : 'Criar Utilizador' }}
        </button>
      </div>
    </div>
  </div>
</div>
