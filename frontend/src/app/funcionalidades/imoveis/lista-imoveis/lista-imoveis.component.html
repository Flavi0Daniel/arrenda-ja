<div class="bg-light py-4">
  <div class="container">
    <!-- Cabeçalho -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="mb-1">
          <i class="bi bi-search me-2"></i>
          Pesquisar Imóveis
        </h2>
        <p class="text-muted mb-0">
          <span *ngIf="totalResultados > 0">{{ totalResultados }} imóveis encontrados</span>
          <span *ngIf="totalResultados === 0 && !carregando">Nenhum imóvel encontrado</span>
        </p>
      </div>
      
      <!-- Botão Filtros -->
      <button class="btn btn-outline-primary" (click)="alternarFiltros()">
        <i class="bi bi-funnel me-2"></i>
        {{ mostrarFiltros ? 'Ocultar' : 'Mostrar' }} Filtros
      </button>
    </div>

    <!-- Painel de Filtros -->
    <div class="card mb-4" *ngIf="mostrarFiltros">
      <div class="card-body">
        <h5 class="card-title mb-3">
          <i class="bi bi-sliders me-2"></i>
          Filtros de Pesquisa
        </h5>

        <div class="row g-3">
          <!-- Tipologia -->
          <div class="col-md-3">
            <label class="form-label">Tipologia</label>
            <select class="form-select" [(ngModel)]="filtros.tipologia">
              <option [ngValue]="undefined">Todas</option>
              <option *ngFor="let tip of tipologias" [value]="tip">{{ tip }}</option>
            </select>
          </div>

          <!-- Província -->
          <div class="col-md-3">
            <label class="form-label">Província</label>
            <select 
              class="form-select" 
              [(ngModel)]="filtros.provincia"
              (change)="onProvinciaChange($any($event.target).value)">
              <option [ngValue]="undefined">Todas</option>
              <option *ngFor="let prov of provincias" [value]="prov">{{ prov }}</option>
            </select>
          </div>

          <!-- Município -->
          <div class="col-md-3">
            <label class="form-label">Município</label>
            <select 
              class="form-select" 
              [(ngModel)]="filtros.municipio"
              [disabled]="!filtros.provincia">
              <option [ngValue]="undefined">Todos</option>
              <option *ngFor="let mun of municipios" [value]="mun">{{ mun }}</option>
            </select>
          </div>

          <!-- Preço Mínimo -->
          <div class="col-md-3">
            <label class="form-label">Preço Mínimo (Kz)</label>
            <input 
              type="number" 
              class="form-control" 
              [(ngModel)]="filtros.precoMinimo"
              placeholder="Ex: 50000">
          </div>

          <!-- Preço Máximo -->
          <div class="col-md-3">
            <label class="form-label">Preço Máximo (Kz)</label>
            <input 
              type="number" 
              class="form-control" 
              [(ngModel)]="filtros.precoMaximo"
              placeholder="Ex: 200000">
          </div>

          <!-- Características -->
          <div class="col-md-9">
            <label class="form-label">Características</label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input 
                  class="form-check-input" 
                  type="checkbox" 
                  id="garagem"
                  [(ngModel)]="filtros.temGaragem">
                <label class="form-check-label" for="garagem">
                  <i class="bi bi-car-front me-1"></i>
                  Garagem
                </label>
              </div>
              <div class="form-check">
                <input 
                  class="form-check-input" 
                  type="checkbox" 
                  id="piscina"
                  [(ngModel)]="filtros.temPiscina">
                <label class="form-check-label" for="piscina">
                  <i class="bi bi-water me-1"></i>
                  Piscina
                </label>
              </div>
              <div class="form-check">
                <input 
                  class="form-check-input" 
                  type="checkbox" 
                  id="mobilado"
                  [(ngModel)]="filtros.estaMobilado">
                <label class="form-check-label" for="mobilado">
                  <i class="bi bi-house-check me-1"></i>
                  Mobilado
                </label>
              </div>
            </div>
          </div>
        </div>

        <!-- Botões -->
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-primary" (click)="aplicarFiltros()">
            <i class="bi bi-search me-2"></i>
            Aplicar Filtros
          </button>
          <button class="btn btn-outline-secondary" (click)="limparFiltros()">
            <i class="bi bi-x-circle me-2"></i>
            Limpar Filtros
          </button>
        </div>
      </div>
    </div>

    <!-- Loading -->
    <app-carregamento 
      *ngIf="carregando" 
      mensagem="A carregar imóveis...">
    </app-carregamento>

    <!-- Erro -->
    <div class="alert alert-danger" *ngIf="erro">
      <i class="bi bi-exclamation-triangle me-2"></i>
      {{ erro }}
    </div>

    <!-- Lista de Imóveis -->
    <div class="row g-4" *ngIf="!carregando && !erro">
      <div class="col-md-4" *ngFor="let imovel of imoveis">
        <app-cartao-imovel [imovel]="imovel"></app-cartao-imovel>
      </div>

      <!-- Nenhum resultado -->
      <div class="col-12 text-center py-5" *ngIf="imoveis.length === 0">
        <i class="bi bi-search text-muted" style="font-size: 4rem;"></i>
        <h4 class="mt-3 text-muted">Nenhum imóvel encontrado</h4>
        <p class="text-muted">Tente ajustar os filtros de pesquisa</p>
        <button class="btn btn-primary" (click)="limparFiltros()">
          Limpar Filtros
        </button>
      </div>
    </div>
  </div>
</div>
